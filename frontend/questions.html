<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Interview Questions</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* =========================================
           PAGE
        ========================================= */

        .questions-page {
            min-height: calc(100vh - 80px);

            max-width: 1000px;

            margin: 0 auto;

            padding: 90px 20px 60px;

            position: relative;

            box-sizing: border-box;
        }


        /* =========================================
           TOP LEFT BACK BUTTON
        ========================================= */

        .top-back {
            position: absolute;

            top: 25px;
            left: 20px;

            display: inline-flex;

            align-items: center;

            gap: 7px;

            padding: 10px 18px;

            border: 1px solid #d0d0d0;

            border-radius: 8px;

            background: #ffffff;

            color: #333333;

            text-decoration: none;

            font-size: 15px;

            font-weight: 600;

            transition: 0.2s ease;
        }

        .top-back:hover {
            background: #f5f5f5;

            border-color: #bbbbbb;
        }


        /* =========================================
           PAGE HEADER
        ========================================= */

        .page-header {
            text-align: center;

            margin-bottom: 25px;
        }

        .page-header h1 {
            margin: 0 0 10px;

            font-size: 32px;
        }

        #roleTitle {
            margin: 0;

            color: #666666;

            font-size: 16px;
        }


        /* =========================================
           BATCH INFORMATION
        ========================================= */

        .batch-information {
            width: 100%;

            padding: 14px 18px;

            margin-bottom: 25px;

            box-sizing: border-box;

            border: 1px solid #e0e0e0;

            border-radius: 10px;

            background: #ffffff;

            text-align: center;

            color: #555555;

            font-size: 14px;
        }


        /* =========================================
           QUESTIONS CONTAINER
        ========================================= */

        .questions-container {
            width: 100%;
        }


        /* =========================================
           QUESTION CARD
        ========================================= */

        .question-card {
            position: relative;

            width: 100%;

            margin-bottom: 16px;

            padding: 22px 24px;

            box-sizing: border-box;

            background: #ffffff;

            border: 1px solid #e5e5e5;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.05);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .question-card:hover {
            transform: translateY(-2px);

            box-shadow:
                0 7px 20px rgba(0, 0, 0, 0.08);
        }


        /* =========================================
           QUESTION NUMBER
        ========================================= */

        .question-number {
            margin-bottom: 10px;

            font-size: 14px;

            font-weight: 700;

            color: #555555;
        }


        /* =========================================
           QUESTION TEXT
        ========================================= */

        .question-text {
            padding-right: 10px;

            font-size: 16px;

            line-height: 1.6;

            color: #222222;
        }


        /* =========================================
           CATEGORY
        ========================================= */

        .question-category {
            display: inline-block;

            margin-top: 15px;

            padding: 5px 10px;

            border-radius: 6px;

            background: #f3f3f3;

            color: #555555;

            font-size: 12px;

            font-weight: 600;
        }


        /* =========================================
           LOADING / EMPTY MESSAGE
        ========================================= */

        .loading-message {
            width: 100%;

            padding: 40px 20px;

            box-sizing: border-box;

            text-align: center;

            color: #666666;

            background: #ffffff;

            border: 1px solid #e5e5e5;

            border-radius: 12px;
        }


        /* =========================================
           GET MORE BUTTON
        ========================================= */

        #loadMoreContainer {
            width: 100%;

            display: flex;

            justify-content: center;

            align-items: center;

            margin-top: 30px;

            margin-bottom: 20px;
        }

        #loadMoreButton {
            min-height: 48px;

            padding: 12px 24px;

            border: none;

            border-radius: 8px;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 8px;
        }

        #loadMoreButton:disabled {
            cursor: not-allowed;

            opacity: 0.7;
        }


        /* =========================================
           NO MORE QUESTIONS
        ========================================= */

        #noMoreMessage {
            margin-top: 30px;

            margin-bottom: 20px;

            padding: 18px;

            text-align: center;

            color: #666666;

            background: #ffffff;

            border: 1px solid #e5e5e5;

            border-radius: 10px;

            box-sizing: border-box;
        }

        #noMoreMessage p {
            margin: 0;

            line-height: 1.5;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            .questions-page {
                padding: 85px 15px 40px;
            }

            .top-back {
                top: 20px;

                left: 15px;
            }

            .page-header h1 {
                font-size: 26px;
            }

            .question-card {
                padding: 18px;
            }

            .question-text {
                font-size: 15px;
            }

            #loadMoreButton {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         HEADER
    ========================================= -->
    <header class="navbar">
        <div class="navbar-container">
    
            <a href="index.html" class="brand">
                <span class="brand-logo">H</span>
                <span class="brand-name">HirePrep</span>
                <span class="brand-tagline">Interview Preparation</span>
            </a>
    
        </div>
    </header>

    <!-- =========================================
         MAIN CONTENT
    ========================================= -->

    <main class="questions-page">


        <!-- BACK BUTTON -->

        <a
            href="question-settings.html"
            class="top-back"
        >
            ← Back
        </a>


        <!-- PAGE HEADER -->

        <section class="page-header">

            <h1>
                Interview Questions
            </h1>

            <p id="roleTitle">
                Loading questions...
            </p>

        </section>


        <!-- BATCH INFORMATION -->

        <div
            id="batchInformation"
            class="batch-information"
        >
            Loading...
        </div>


        <!-- QUESTIONS -->

        <section
            id="questionsContainer"
            class="questions-container"
        >

            <div class="loading-message">
                Loading questions...
            </div>

        </section>


        <!-- GET MORE QUESTIONS -->

        <div
            id="loadMoreContainer"
            style="display: none;"
        >

            <button
                id="loadMoreButton"
                class="primary-btn"
                type="button"
            >

                Get More Questions

                <span>
                    →
                </span>

            </button>

        </div>


        <!-- NO MORE QUESTIONS -->

        <div
            id="noMoreMessage"
            style="display: none;"
        >

            <p>
                You have reached the end of the available
                verified questions for this role.
            </p>

        </div>

    </main>


    <script>


        /* =========================================================
           API
        ========================================================= */

        const API_BASE_URL =
            "http://127.0.0.1:8000";


        /* =========================================================
           ELEMENTS
        ========================================================= */

        const questionsContainer =
            document.getElementById(
                "questionsContainer"
            );


        const batchInformation =
            document.getElementById(
                "batchInformation"
            );


        const loadMoreContainer =
            document.getElementById(
                "loadMoreContainer"
            );


        const loadMoreButton =
            document.getElementById(
                "loadMoreButton"
            );


        const noMoreMessage =
            document.getElementById(
                "noMoreMessage"
            );


        const roleTitle =
            document.getElementById(
                "roleTitle"
            );


        /* =========================================================
           PAGINATION STATE
        ========================================================= */

        let selectedRole = "";

        let currentOffset = 0;

        let nextOffset = null;

        let hasMoreQuestions = false;

        let allQuestions = [];


        /* =========================================================
           GET ROLE FROM URL
        ========================================================= */

        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        selectedRole =
            urlParams.get("role");


        /* =========================================================
           CHECK ROLE
        ========================================================= */

        if (!selectedRole) {

            roleTitle.textContent =
                "No job role selected.";


            questionsContainer.innerHTML = `
                <div class="loading-message">
                    Please select a job role first.
                </div>
            `;

        }

        else {

            roleTitle.textContent =
                `Role: ${selectedRole}`;


            loadFirstBatch();

        }


        /* =========================================================
           LOAD FIRST 100 QUESTIONS
        ========================================================= */

        async function loadFirstBatch() {

            currentOffset = 0;

            nextOffset = null;

            hasMoreQuestions = false;

            allQuestions = [];


            await fetchQuestionBatch(
                0,
                false
            );

        }


        /* =========================================================
           FETCH QUESTIONS
        ========================================================= */

        async function fetchQuestionBatch(
            offset,
            append
        ) {

            try {


                questionsContainer.innerHTML = `
                    <div class="loading-message">
                        Loading questions...
                    </div>
                `;


                const apiUrl =
                    `${API_BASE_URL}/questions?role=${encodeURIComponent(selectedRole)}&offset=${offset}`;


                console.log(
                    "Fetching:",
                    apiUrl
                );


                const response =
                    await fetch(apiUrl);


                if (!response.ok) {

                    throw new Error(
                        `HTTP error: ${response.status}`
                    );

                }


                const data =
                    await response.json();


                console.log(
                    "API Response:",
                    data
                );


                if (!data.success) {

                    throw new Error(
                        data.message ||
                        "Unable to load questions."
                    );

                }


                /* =================================================
                   STORE QUESTIONS
                ================================================= */

                if (append) {

                    allQuestions =
                        allQuestions.concat(
                            data.questions || []
                        );

                }

                else {

                    allQuestions =
                        data.questions || [];

                }


                /* =================================================
                   UPDATE PAGINATION
                ================================================= */

                currentOffset =
                    Number(
                        data.offset || 0
                    );


                nextOffset =
                    data.next_offset !== null &&
                    data.next_offset !== undefined
                        ? Number(data.next_offset)
                        : null;


                hasMoreQuestions =
                    data.has_more === true;


                console.log(
                    "Current Offset:",
                    currentOffset
                );


                console.log(
                    "Next Offset:",
                    nextOffset
                );


                console.log(
                    "Has More:",
                    hasMoreQuestions
                );


                console.log(
                    "Total Loaded:",
                    allQuestions.length
                );


                /* =================================================
                   DISPLAY QUESTIONS
                ================================================= */

                displayQuestions(
                    allQuestions
                );


                /* =================================================
                   UPDATE INFORMATION
                ================================================= */

                updateBatchInformation(
                    data
                );


                /* =================================================
                   UPDATE GET MORE BUTTON
                ================================================= */

                updateLoadMoreButton();

            }


            catch (error) {

                console.error(
                    "Question loading error:",
                    error
                );


                questionsContainer.innerHTML = `
                    <div class="loading-message">

                        <h3>
                            Unable to load questions
                        </h3>

                        <p>
                            ${error.message}
                        </p>

                    </div>
                `;


                loadMoreContainer.style.setProperty(
                    "display",
                    "none",
                    "important"
                );

            }

        }


        /* =========================================================
           DISPLAY QUESTIONS
        ========================================================= */

        function displayQuestions(
            questions
        ) {

            questionsContainer.innerHTML = "";


            if (
                !questions ||
                questions.length === 0
            ) {

                questionsContainer.innerHTML = `
                    <div class="loading-message">
                        No verified questions available.
                    </div>
                `;

                return;

            }


            questions.forEach(
                function(
                    question,
                    index
                ) {


                    const questionCard =
                        document.createElement(
                            "div"
                        );


                    questionCard.className =
                        "question-card";


                    /* QUESTION NUMBER */

                    const questionNumber =
                        document.createElement(
                            "div"
                        );


                    questionNumber.className =
                        "question-number";


                    questionNumber.textContent =
                        `Q${index + 1}`;


                    /* QUESTION TEXT */

                    const questionText =
                        document.createElement(
                            "div"
                        );


                    questionText.className =
                        "question-text";


                    questionText.textContent =
                        question.question;


                    questionCard.appendChild(
                        questionNumber
                    );


                    questionCard.appendChild(
                        questionText
                    );


                    /* CATEGORY */

                    if (
                        question.category
                    ) {

                        const category =
                            document.createElement(
                                "div"
                            );


                        category.className =
                            "question-category";


                        category.textContent =
                            question.category;


                        questionCard.appendChild(
                            category
                        );

                    }


                    questionsContainer.appendChild(
                        questionCard
                    );

                }
            );

        }


        /* =========================================================
           UPDATE BATCH INFORMATION
        ========================================================= */

        function updateBatchInformation(
            data
        ) {

            const totalLoaded =
                allQuestions.length;


            const available =
                Number(
                    data.available_questions || 0
                );


            if (totalLoaded === 0) {

                batchInformation.textContent =
                    "No questions available.";

                return;

            }


            batchInformation.textContent =
                `Showing ${totalLoaded} verified questions`;


            if (available > totalLoaded) {

                batchInformation.textContent +=
                    ` of ${available} available`;

            }

        }


        /* =========================================================
           GET MORE BUTTON
        ========================================================= */

        function updateLoadMoreButton() {


            if (
                hasMoreQuestions &&
                nextOffset !== null &&
                nextOffset < 500
            ) {


                loadMoreContainer.style.setProperty(
                    "display",
                    "flex",
                    "important"
                );


                loadMoreButton.disabled =
                    false;


                loadMoreButton.innerHTML = `
                    Get More Questions
                    <span>→</span>
                `;


                noMoreMessage.style.setProperty(
                    "display",
                    "none",
                    "important"
                );

            }


            else {


                loadMoreContainer.style.setProperty(
                    "display",
                    "none",
                    "important"
                );


                /*
                   Only show the final message if
                   questions have actually been loaded.
                */

                if (allQuestions.length > 0) {

                    noMoreMessage.style.setProperty(
                        "display",
                        "block",
                        "important"
                    );

                }

            }

        }


        /* =========================================================
           GET MORE BUTTON CLICK
        ========================================================= */

        loadMoreButton.addEventListener(
            "click",
            async function() {


                if (
                    !hasMoreQuestions ||
                    nextOffset === null
                ) {

                    return;

                }


                loadMoreButton.disabled =
                    true;


                loadMoreButton.innerHTML = `
                    Loading More Questions...
                `;


                const requestedOffset =
                    nextOffset;


                console.log(
                    "Loading next batch from offset:",
                    requestedOffset
                );


                await fetchQuestionBatch(
                    requestedOffset,
                    true
                );


                loadMoreButton.disabled =
                    false;


                if (
                    hasMoreQuestions
                ) {

                    loadMoreButton.innerHTML = `
                        Get More Questions
                        <span>→</span>
                    `;

                }

            }
        );

    </script>


</body>

</html>
